# Sway for the SDDM greeter (Riley). Written by riley-greeter-sync from your display settings; do not edit.
xwayland disable
swaybg_command -
# Screens as in Riley Settings. sway turns the other way from Hyprland: sway 90 = Hyprland transform 3.
output "Dell Inc. DELL U2515H YKFWP4CC09VL" mode 2560x1440@59.95Hz position 0 0 scale 1 transform 90
output "Samsung Electric Company S34C65xU HCNYB00237" mode 3440x1440@59.97Hz position 1440 407 scale 1 transform normal
output "Samsung Electric Company S34C65xU HCNYB00019" mode 3440x1440@59.97Hz position 4880 407 scale 1 transform normal
output "GWD ARZOPA 0x37330206" mode 2560x1600@60.00Hz position 1440 1847 scale 1.5 transform normal
output "GWD ARZOPA 0000001504150" disable
seat * xcursor_theme Adwaita 24
input type:keyboard xkb_layout us
exec command -v swayidle >/dev/null && swayidle -w timeout 300 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'
for_window [app_id="^sddm-greeter"] fullscreen enable
